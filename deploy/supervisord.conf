[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/workspace-supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -ac -nolisten tcp
user=wine
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
user=wine
priority=20
autostart=true
autorestart=true
startretries=10
environment=HOME="/home/wine",DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -rfbport 5900 -nopw -noxdamage
user=wine
priority=30
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=wine
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:workspace]
command=/usr/local/bin/bun /app/server/index.ts
directory=/app
user=wine
priority=50
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=HOME="/home/wine",DISPLAY=":99",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
